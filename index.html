
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="calculator">
            <h1>Student Grade Calculator</h1>
            <p class="subtitle">Calculate your academic performance</p>

            <form id="gradeForm">

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name" required>

                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber"
                       placeholder="Enter roll number" required>

                <h3>Enter Subject Marks</h3>

                <div class="marks-grid">
                    <div>
                        <label for="subject1">Mathematics</label>
                        <input type="number" id="subject1"
                               placeholder="0 - 100" min="0" max="100" required>
                    </div>

                    <div>
                        <label for="subject2">Computer Science</label>
                        <input type="number" id="subject2"
                               placeholder="0 - 100" min="0" max="100" required>
                    </div>

                    <div>
                        <label for="subject3">Physics</label>
                        <input type="number" id="subject3"
                               placeholder="0 - 100" min="0" max="100" required>
                    </div>

                    <div>
                        <label for="subject4">Chemistry</label>
                        <input type="number" id="subject4"
                               placeholder="0 - 100" min="0" max="100" required>
                    </div>

                    <div>
                        <label for="subject5">English</label>
                        <input type="number" id="subject5"
                               placeholder="0 - 100" min="0" max="100" required>
                    </div>
                </div>

                <button type="submit">Calculate Grade</button>
                <button type="reset" class="reset-btn">Reset</button>

            </form>

            <div id="result" class="result hidden">
                <h2>Result Summary</h2>

                <p><strong>Student:</strong> <span id="resultName"></span></p>
                <p><strong>Roll Number:</strong> <span id="resultRoll"></span></p>
                <p><strong>Total Marks:</strong> <span id="total"></span> / 500</p>
                <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>
                <p><strong>Grade:</strong> <span id="grade"></span></p>
                <p><strong>Status:</strong> <span id="status"></span></p>

            </div>

            <p class="footer">Developed using HTML, CSS and JavaScript</p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
